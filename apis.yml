description: >-
  MEDx Translational Medicine Co., Ltd (MEDx TMC) is a Suzhou, China based precision
  medicine company founded in 2013, formerly QIAGEN (Suzhou) Translational Medicine.
  It is a leading provider of companion diagnostics (CDx) and total precision-medicine
  solutions, offering pharma services (biomarker discovery, target validation, patient
  stratification, IVD/CDx R&D and commercialization), clinical testing panels for solid
  tumors, blood cancers and infectious diseases, and diagnostic products built on IHC,
  PCR and NGS platforms. MEDx has collaborated with 400+ pharmaceutical and technology
  partners and holds ISO 13485, ISO 17025, CAP and CNAS accreditations. It is a
  portfolio company of Qiming Venture Partners. MEDx TMC publishes no public developer
  API, developer portal, or SDKs; this profile captures company identity for the API
  Evangelist network.
